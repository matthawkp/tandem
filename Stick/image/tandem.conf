# Tandem Display settings. Lines starting with # are ignored: remove the # to use one.
# Edit this on any computer, then start the iMac from the stick again.

# The name the Mac sees, and gives its extra display. (Default: iMac.)
#name=iMac

# One fixed picture size instead of the panel's own, e.g. the 4K compatibility mode.
#mode=3840x2160

# If the picture's left and right halves are the wrong way round.
#swap_halves=yes

# The panel's size in millimetres, if the Mac gets it wrong (27-inch iMac: 597x336).
#size_mm=597x336

# What "asleep" means when the Mac sleeps: dim (black picture, backlight right down) or
# off (the panel itself off; it has to come back on its own afterwards).
#sleep=dim

# Minutes with no Mac connected before the screen goes dark. 0: never.
#idle_blank_minutes=10

# This iMac's keyboard and mouse control the Mac while it's showing a picture.
#keyboard_and_mouse=no
#pointer_speed=1.0

# Which brightness control to use, from /sys/class/backlight (see tandem-logs/.../system.txt).
#backlight=acpi_video0

# The last few log lines, faintly, on the waiting screen. (Always there when the boot menu's
# fault finding entry is chosen.)
#show_log=yes

# More in the logs: a line for frames shown every few seconds, and picture checksums.
#debug=yes

# SSH over the cable, for looking at faults: on when there's a key to let in, which is either
# the one made when this image was built, or one you put on this stick as
# tandem/authorized_keys (a public key, as in ~/.ssh/authorized_keys). Never a password.
#ssh=no
