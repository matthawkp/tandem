# Tandem Display's boot menu, which is never shown: the iMac goes straight to the entry chosen
# by "default". The 5K entry needs nothing else: if the panel's second half doesn't come up, it
# shows 3840x2160 by itself. The others are for when the 5K entry itself goes wrong; to use
# one, change "default" here on any computer:
#   0  5K: the patched graphics driver, the panel's full 5120x2880
#   1  4K: the graphics driver as it comes, the panel in its 3840x2160 compatibility mode
#   2  no graphics driver at all: slow, drawn by the processor, for finding faults
set default=0
set timeout_style=hidden
set timeout=0
source /tandem/look.cfg

# For every entry. hid_apple.iso_layout=0 keeps an Apple keyboard's two swappable keys as the
# Mac expects them; acpi_backlight=video is the brightness control that works on these iMacs.
set common="console=tty0 consoleblank=0 fbcon=font:TER16x32 hid_apple.iso_layout=0 acpi_backlight=video"
# Nothing written on the screen while starting, so the picture stays (the kernel's messages are
# all still in tandem-logs on the stick).
set quiet="quiet loglevel=3 vt.global_cursor_default=0"
# What the 5K patch's author recommends for these iMacs' graphics.
set graphics="amdgpu.ppfeaturemask=0xfff7bbff intel_iommu=on iommu=pt"

menuentry "Tandem Display - 5K (5120 x 2880)" {
    linux /tandem/vmlinuz tandem.look=$look tandem.found=$found $common $quiet $graphics
    initrd /tandem/initramfs.zst
}
menuentry "Tandem Display - 4K (3840 x 2160, unpatched graphics driver)" {
    linux /tandem/vmlinuz tandem.look=$look tandem.found=$found $common $quiet $graphics tandem.stock
    initrd /tandem/initramfs.zst /tandem/stock.zst
}
menuentry "Tandem Display - fault finding (no graphics driver, slow, shows everything)" {
    linux /tandem/vmlinuz tandem.look=$look tandem.found=$found $common loglevel=7 tandem.nogpu
    initrd /tandem/initramfs.zst
}
