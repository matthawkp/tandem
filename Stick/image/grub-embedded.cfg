# Built into BOOTX64.EFI: find the stick and hand over to the menu on it.
#
# First the disk the firmware started this from ($cmdpath is "(hd1,msdos1)/EFI/BOOT" or the
# like); failing that, any volume named TANDEM. How it was found goes to Linux as tandem.found
# (see grub.cfg), so the logs say.
set found=
regexp --set=1:disk '^\(([^)]*)\)' "$cmdpath"
if [ -n "$disk" ]; then
    if [ -f "($disk)/tandem/grub.cfg" ]; then
        set root="$disk"
        set found=cmdpath
    fi
fi
if [ -z "$found" ]; then
    for try in 1 2 3 4 5; do
        if search --no-floppy --label TANDEM --set=root; then
            if [ -f /tandem/grub.cfg ]; then
                set found="label$try"
                break
            fi
        fi
        sleep 1
    done
fi
export found
if [ -n "$found" ]; then
    configfile /tandem/grub.cfg
fi

# Not found. Said on the screen for a minute, with the disks it can see, before going back to
# the firmware (which then starts the Mac's usual disk).
insmod all_video
insmod gfxterm
if loadfont ascii; then terminal_output gfxterm; fi
echo "Tandem Display: couldn't find /tandem/grub.cfg (started from $cmdpath)."
echo "The disks it can see:"
ls
sleep 60
