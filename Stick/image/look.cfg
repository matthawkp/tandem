# How starting up looks: the waiting screen's picture, saying "Starting", from the moment the
# iMac starts from the stick. Linux leaves it on screen (nothing is written over it with
# "quiet") until the display program draws the same screen with its dots moving.
#
# How far it got goes to Linux as tandem.look (see grub.cfg), so the logs say, on firmware
# where the picture doesn't appear, which step went wrong.
set look=start
insmod all_video
insmod gfxterm
insmod gfxterm_background
insmod tga
if loadfont ascii; then set look=font; fi
set gfxmode=auto
set gfxpayload=keep
if terminal_output gfxterm; then
    set look="$look,gfxterm"
    if background_image -m stretch /tandem/starting.tga; then set look="$look,picture"; fi
    # GRUB draws off the screen and only copies it on when the terminal is written to: with
    # the menu hidden, nothing ever is, so the picture would never appear (the screen stays
    # black). Writing a space, in black, puts it on without a cursor showing.
    set color_normal=black/black
    echo -n " "
    # The menu, if it's asked for, drawn over the picture ("black" lets the picture through).
    set color_normal=light-gray/black
    set color_highlight=white/dark-gray
    set menu_color_normal=light-gray/black
    set menu_color_highlight=white/dark-gray
fi
