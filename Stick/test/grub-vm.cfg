# The boot menu for trying the image in a virtual machine: messages to the serial port, and
# ordinary Ethernet standing in for the Thunderbolt cable. ENTRY=1 test/run-vm.sh starts the
# second entry, which starts as quietly as the iMac does, with the picture.
set default=0
set timeout=1
source /tandem/look.cfg
menuentry "Tandem Display (virtual machine test)" {
    linux /tandem/vmlinuz tandem.look=$look tandem.found=$found console=tty0 console=ttyS0,115200 loglevel=5 consoleblank=0 tandem.test
    initrd /tandem/initramfs.zst
}
menuentry "Tandem Display (virtual machine test, quiet like the iMac)" {
    linux /tandem/vmlinuz tandem.look=$look tandem.found=$found console=ttyS0,115200 console=tty0 consoleblank=0 quiet loglevel=3 vt.global_cursor_default=0 tandem.test
    initrd /tandem/initramfs.zst
}
